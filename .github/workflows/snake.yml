name: Generate Neon Green Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate Neon Green Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg?color_snake=%2300ff88&color_dots=%230d1117,%23003324,%23006648,%2300aa70,%2300ff88
            github-contribution-grid-snake-dark.svg?color_snake=%2300ff88&color_dots=%230d1117,%23003324,%23006648,%2300aa70,%2300ff88

      - name: Commit Snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git diff --cached --quiet || git commit -m "Update neon green snake"
          git push origin main
